name: PHP CS Fixer

on:
  push:
    branches:
      - "8.0"
      - "8.0-CONTRIBUTING"
  pull_request:

jobs:
  php-cs-fixer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 10

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          tools: composer,cs2pr,php-cs-fixer

      - name: Install dependencies
        run: composer install --no-progress --no-suggest --prefer-dist

      - name: Fetch all branches
        run: git fetch --all

      - name: Get list of changed PHP files
        id: changed_files
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          HEAD_REF="${{ github.event.pull_request.head.ref }}"
          
          git diff --name-only --diff-filter=d $BASE_REF $HEAD_REF | grep '\.php$' > changed_files.txt
          if [ -s changed_files.txt ]; then
            echo "files=$(cat changed_files.txt | paste -sd " ")" >> $GITHUB_ENV
          else
            echo "files=" >> $GITHUB_ENV
          fi

      - name: Run PHP CS Fixer
        if: env.files != ''
        run: php-cs-fixer fix $files --dry-run --diff --rules=@PER-CS2.0 --format=checkstyle | cs2pr
