name: PHP CS Fixer

on:
  pull_request:

jobs:
  php-cs-fixer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 10

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          tools: cs2pr,php-cs-fixer

      - name: aaaa
        run: git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }}

      - name: Run PHP CS Fixer
        run: php-cs-fixer fix src --dry-run --diff --format=checkstyle | cs2pr

